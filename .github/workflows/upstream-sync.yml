---
name: Sync upstream main

on:
    schedule:
        - cron: 17 */6 * * *
    workflow_dispatch:

permissions:
    actions: write
    contents: write

concurrency:
    group: upstream-main-sync
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'chartmetric/software-agent-sdk'
        runs-on: ubuntu-latest
        steps:
            - name: Check out fork main
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: main

            - name: Merge upstream main
              id: merge
              run: |
                  set -euo pipefail
                  git remote add upstream https://github.com/OpenHands/software-agent-sdk.git
                  git fetch --no-tags upstream main

                  if git merge-base --is-ancestor upstream/main HEAD; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # A conflict here is a real divergence a person has to
                  # resolve, and the run said so only as "exit code 1" with the
                  # conflicting paths buried in the log. Say what conflicted, in
                  # the summary, and leave the checkout clean; the run still
                  # fails, because the fork really is behind.
                  if ! git merge --no-edit upstream/main; then
                    {
                      echo "## Upstream merge conflicts"
                      echo
                      echo "This fork's \`main\` is $(git rev-list --count HEAD..upstream/main) commits behind"
                      echo "upstream and $(git rev-list --count upstream/main..HEAD) ahead."
                      echo "These paths need a human merge:"
                      echo
                      git diff --name-only --diff-filter=U | sed 's/^/- /'
                    } >> "$GITHUB_STEP_SUMMARY"
                    git merge --abort
                    echo "::error::Upstream main does not merge cleanly; see the job summary."
                    exit 1
                  fi
                  git push origin HEAD:main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Build synchronized agent-server image
              if: steps.merge.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run server.yml --ref main
